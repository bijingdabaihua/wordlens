<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordLens 设置</title>
  <link rel="stylesheet" href="../popup/popup.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>WordLens 设置</h1>
    </header>

    <!-- API Key Section -->
    <section id="api-key-section">
      <div class="field-group">
        <label for="api-key-input" style="display:flex;align-items:center;gap:6px;">
          API Key（DeepSeek）
          <span id="key-status-dot" class="key-dot idle"></span>
        </label>
        <div class="input-row">
          <div class="input-wrap">
            <input
              id="api-key-input"
              type="password"
              placeholder="sk-..."
              spellcheck="false"
            />
            <button id="toggle-key-visibility" class="btn-icon" title="显示/隐藏">👁</button>
          </div>
        </div>
      </div>
    </section>

    <hr />

    <!-- Data Section -->
    <section id="data-section">
      <div class="field-group">
        <label style="flex:0 0 auto;margin:0;font-size:13px;display:flex;align-items:center;gap:6px;">
          GitHub
          <span id="repo-status-dot" class="key-dot idle"></span>
        </label>
        <input id="repo-url-input" type="text" placeholder="owner/repo" spellcheck="false"
               style="flex:1;min-width:120px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:inherit;" />
        <input id="repo-token-input" type="password" placeholder="token" spellcheck="false"
               style="flex:0 0 100px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:inherit;" />
      </div>
    </section>

    <hr />

    <!-- Stats Section -->
    <section id="stats-section">
      <div id="stats-display">
        <div class="stat-item">
          <span class="stat-label">总单词数</span>
          <span id="stat-total" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">学习中</span>
          <span id="stat-learning" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">已掌握</span>
          <span id="stat-mastered" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">词汇量估算</span>
          <span id="stat-vocab" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">CEFR 等级</span>
          <span id="stat-cefr" class="stat-value">-</span>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="options.ts"></script>
</body>
</html>
