<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- 镜片外圈 -->
  <circle cx="56" cy="56" r="32" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5"/>
  <circle cx="56" cy="56" r="22" fill="rgba(255,255,255,0.15)"/>
  <!-- 镜片反光 -->
  <path d="M40 44 Q48 38, 56 42" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 镜柄 -->
  <line x1="80" y1="80" x2="104" y2="104" stroke="rgba(255,255,255,0.9)" stroke-width="6" stroke-linecap="round"/>
  <!-- "W" 字母 -->
  <text x="56" y="66" text-anchor="middle" font-size="28" font-family="Georgia, serif" fill="white" font-weight="700">W</text>
</svg>
