<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordLens 设置</title>
  <link rel="stylesheet" href="../popup/popup.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>WordLens 设置</h1>
    </header>

    <!-- API Key Section -->
    <section id="api-key-section">
      <h2>DeepSeek API</h2>
      <p class="section-desc">输入你的 DeepSeek API Key 以启用 AI 翻译功能。</p>

      <div class="field-group">
        <label for="api-key-input">API Key</label>
        <div class="input-row">
          <input
            id="api-key-input"
            type="password"
            placeholder="sk-..."
            spellcheck="false"
          />
          <button id="toggle-key-visibility" class="btn btn-icon" title="显示/隐藏">👁</button>
        </div>
      </div>

      <div class="field-group">
        <button id="test-connection-btn" class="btn btn-secondary">测试连接</button>
        <button id="save-key-btn" class="btn btn-primary">保存</button>
      </div>

      <div id="api-status" class="status-msg hidden"></div>
    </section>

    <hr />

    <!-- About Section -->
    <section id="about-section">
      <h2>关于</h2>
      <p class="section-desc">WordLens v1.0.0 — Chrome 浏览器插件，阅读英文网页时学英语。</p>
      <ul>
        <li><strong>Alt + 悬停</strong> — 翻译单词</li>
        <li><strong>选中文本</strong> — 翻译句子</li>
      </ul>
    </section>

    <hr />

    <!-- Data Section -->
    <section id="data-section">
      <h2>数据管理</h2>

      <div class="field-group">
        <button id="export-btn" class="btn btn-secondary">导出数据</button>
        <button id="import-btn" class="btn btn-secondary">导入数据</button>
        <input id="import-file-input" type="file" accept=".json" class="hidden" />
      </div>

      <div class="field-group">
        <button id="clear-btn" class="btn btn-danger">清空所有数据</button>
      </div>

      <div id="data-status" class="status-msg hidden"></div>
    </section>

    <hr />

    <!-- Stats Section -->
    <section id="stats-section">
      <h2>词汇统计</h2>
      <div id="stats-display">
        <div class="stat-item">
          <span class="stat-label">总单词数</span>
          <span id="stat-total" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">学习中</span>
          <span id="stat-learning" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">已掌握</span>
          <span id="stat-mastered" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">词汇量估算</span>
          <span id="stat-vocab" class="stat-value">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">CEFR 等级</span>
          <span id="stat-cefr" class="stat-value">-</span>
        </div>
      </div>
      <button id="refresh-stats-btn" class="btn btn-secondary">刷新统计</button>
    </section>
  </div>

  <script type="module" src="options.ts"></script>
</body>
</html>
